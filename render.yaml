services:
  - type: web
    name: sentinel-sandbox
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python vulnerable-api/main.py
    healthCheckPath: /health

  - type: web
    name: sentinel-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SANDBOX_TARGET_URL
        fromService:
          type: web
          name: sentinel-sandbox
          property: host

  - type: web
    name: sentinel-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sentinel-api
          property: host
      - key: VITE_TARGET_URL
        fromService:
          type: web
          name: sentinel-sandbox
          property: host
